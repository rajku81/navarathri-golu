name: Optimize photos

on:
  push:
    branches: [main]
    paths: ["media/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-images
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install HEIC converter
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libheif-examples
      - run: npm install --no-audit --no-fund
      - run: npm run optimize-images
      - name: Commit smaller photos
        run: |
          git config user.name "photo-optimizer"
          git config user.email "actions@users.noreply.github.com"
          git add -A media content
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "Optimize uploaded photos"
          git pull --rebase
          git push
